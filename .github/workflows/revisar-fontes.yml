name: Monitorar fontes oficiais diariamente

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar fontes externas cadastradas
        id: monitor
        shell: bash
        run: |
          result="$(node scripts/revisar-fontes-oficiais.mjs)"
          echo "$result"
          should_commit="$(node -e 'const result = JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(result.shouldCommit)))' "$result")"
          echo "should_commit=$should_commit" >> "$GITHUB_OUTPUT"
      - name: Registrar mudança relevante
        id: changes
        shell: bash
        run: |
          if [ "${{ steps.monitor.outputs.should_commit }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Orion Academy Bot"
          git config user.email "actions@github.com"
          git add dados-revisao
          git commit -m "chore: monitora fontes oficiais"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Abrir pendência para confirmação editorial
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "Revisão editorial: fontes oficiais com alterações in:title" --json number --jq 'length')
          if grep -q "## Itens para revisão editorial" dados-revisao/pendencias-fontes.md && [ "$existing" = "0" ]; then
            gh issue create --title "Revisão editorial: fontes oficiais com alterações" --body-file dados-revisao/pendencias-fontes.md
          fi
