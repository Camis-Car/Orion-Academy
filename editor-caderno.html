  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cadastro-config.js"></script>
  <script>
  if (false) { // implementação anterior preservada apenas como histórico local
  (()=>{const cfg=window.PROJETO_AQUILES_SUPABASE||{},ready=window.supabase&&/^https:\/\//.test(cfg.url||'')&&String(cfg.anonKey||'').length>20,$=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),status=$('#status');let client,user,book,mode='type',pen='#173a5e',penSize=4,eraserSize=20,tool='pen',penOnly=true,drawing=false,stroke=null,history=[],timer;
  const uid=()=>crypto.randomUUID?crypto.randomUUID():`stroke-${Date.now()}-${Math.random().toString(16).slice(2)}`,clone=v=>JSON.parse(JSON.stringify(v)),message=(a,b)=>{status.hidden=false;status.innerHTML=`<b>${a}</b><br>${b}`},sheet=()=>book?.paginas?.[0];const normalize=b=>{const p=Array.isArray(b.paginas)&&b.paginas.length?b.paginas:[{id:uid(),titulo:'Folha livre',texto:'',desenho:'',tracos:[]}];p[0].texto=typeof p[0].texto==='string'?p[0].texto:'';p[0].desenho=typeof p[0].desenho==='string'?p[0].desenho:'';p[0].tracos=Array.isArray(p[0].tracos)?p[0].tracos:[];return{...b,paginas:p}};
  function label(t,b=false){$('#saveNow').textContent=t;$('#saveNow').disabled=b}function snap(){history.push(clone(sheet().tracos));if(history.length>32)history.shift()}function renderStroke(c,s){const p=s?.pontos||[];if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.lineWidth=s.ferramenta==='highlight'?Number(s.tamanho)*4:Number(s.tamanho);c.globalAlpha=s.ferramenta==='highlight'?.25:1;c.strokeStyle=s.cor;c.beginPath();c.moveTo(p[0].x,p[0].y);if(p.length===1)c.lineTo(p[0].x+.1,p[0].y+.1);else p.slice(1).forEach(x=>c.lineTo(x.x,x.y));c.stroke();c.restore()}function paint(){const s=sheet();ctx.clearRect(0,0,canvas.width,canvas.height);const traces=()=>s.tracos.forEach(x=>renderStroke(ctx,x));if(!s.desenho){traces();return}const i=new Image();i.onload=()=>{ctx.drawImage(i,0,0,canvas.width,canvas.height);traces()};i.onerror=traces;i.src=s.desenho}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function distance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
  function changed(){clearTimeout(timer);label('Alterações pendentes');timer=setTimeout(()=>save(),1500)}async function save(force=false){if(!book)return;clearTimeout(timer);book.updated_at=new Date().toISOString();label('Salvando…',true);const{error}=await client.from('cadernos_estudo').upsert({id:book.id,perfil_id:user.id,titulo:book.titulo||'Caderno sem título',cor:book.cor,paginas:book.paginas,updated_at:book.updated_at},{onConflict:'id'});if(error){message('Não foi possível salvar.',error.message||'Tente novamente.');label('Salvar agora');return}label(force?'Salvo agora':'Salvo')}function erase(p){const s=sheet();for(let i=s.tracos.length-1;i>=0;i--){const t=s.tracos[i],pts=t.pontos||[],r=eraserSize*2.4+Number(t.tamanho||4)/2;if(pts.some((x,n)=>n?distance(p,pts[n-1],x)<=r:Math.hypot(p.x-x.x,p.y-x.y)<=r)){snap();s.tracos.splice(i,1);paint();changed();return}}}

  <script>
  (() => {
    const cfg = window.PROJETO_AQUILES_SUPABASE || {};
    const ready = window.supabase && /^https:\/\//.test(cfg.url || '') && String(cfg.anonKey || '').length > 20;
    const $ = selector => document.querySelector(selector);
    const canvas = $('#canvas'), ctx = canvas.getContext('2d'), status = $('#status');
    let client, user, book, mode = 'type', tool = 'pen', pen = '#173a5e', penSize = 4, eraserSize = 20;
    let penOnly = true, drawing = false, stroke = null, lastErasePoint = null, history = [], timer, revision = 0, saving = false;

    const uid = () => crypto.randomUUID ? crypto.randomUUID() : `stroke-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const sheet = () => book?.paginas?.[0];
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const message = (title, text) => {
      status.hidden = false;
      status.replaceChildren();
      const strong = document.createElement('strong');
      strong.textContent = title;
      status.append(strong, document.createElement('br'), document.createTextNode(text));
    };
    const normalize = item => {
      const pages = Array.isArray(item.paginas) && item.paginas.length ? item.paginas : [{ id: uid(), titulo: 'Folha livre', texto: '', desenho: '', tracos: [] }];
      pages[0].texto = typeof pages[0].texto === 'string' ? pages[0].texto : '';
      pages[0].desenho = typeof pages[0].desenho === 'string' ? pages[0].desenho : '';
      pages[0].tracos = Array.isArray(pages[0].tracos) ? pages[0].tracos : [];
      return { ...item, cor: item.cor || '#173a5e', paginas: pages };
    };
    const label = (text, disabled = false) => { $('#saveNow').textContent = text; $('#saveNow').disabled = disabled; };
    const remember = item => { history.push(item); if (history.length > 60) history.shift(); };

    function penStyle(item) {
      return { width: item.ferramenta === 'highlight' ? Number(item.tamanho) * 4 : Number(item.tamanho), alpha: item.ferramenta === 'highlight' ? .25 : 1 };
    }
    function drawSegment(from, to, item) {
      const style = penStyle(item);
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = style.width; ctx.globalAlpha = style.alpha; ctx.strokeStyle = item.cor;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); ctx.restore();
    }
    function drawStroke(item) {
      const points = item?.pontos || [];
      if (!points.length) return;
      if (points.length === 1) { drawSegment(points[0], { x: points[0].x + .1, y: points[0].y + .1 }, item); return; }
      const style = penStyle(item);
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = style.width; ctx.globalAlpha = style.alpha; ctx.strokeStyle = item.cor;
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
      for (let index = 1; index < points.length; index += 1) ctx.lineTo(points[index].x, points[index].y);
      ctx.stroke(); ctx.restore();
    }
    function paint() {
      const current = sheet();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const traces = () => current.tracos.forEach(drawStroke);
      if (!current.desenho) { traces(); return; }
      const image = new Image();
      image.onload = () => { ctx.drawImage(image, 0, 0, canvas.width, canvas.height); traces(); };
      image.onerror = traces; image.src = current.desenho;
    }
    function point(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height };
    }
    function pointToSegment(pointToTest, first, second) {
      const dx = second.x - first.x, dy = second.y - first.y, length = dx * dx + dy * dy || 1;
      const ratio = Math.max(0, Math.min(1, ((pointToTest.x - first.x) * dx + (pointToTest.y - first.y) * dy) / length));
      return Math.hypot(pointToTest.x - (first.x + ratio * dx), pointToTest.y - (first.y + ratio * dy));
    }

    function changed(delay = 900) {
      revision += 1; clearTimeout(timer); label('Salva automaticamente…');
      timer = setTimeout(() => save(revision), delay);
    }
    async function save(targetRevision = revision, forced = false) {
      if (!book) return;
      clearTimeout(timer);
      if (saving) { timer = setTimeout(() => save(revision, forced), 280); return; }
      saving = true; book.updated_at = new Date().toISOString(); label('Salvando…', true);
      const { error } = await client.from('cadernos_estudo').upsert({ id: book.id, perfil_id: user.id, titulo: book.titulo || 'Caderno sem título', cor: book.cor, paginas: book.paginas, updated_at: book.updated_at }, { onConflict: 'id' });
      saving = false;
      if (error) { message('Não foi possível salvar.', error.message || 'Tente novamente.'); label('Salvar agora'); return; }
      if (revision > targetRevision) { label('Alterações pendentes'); timer = setTimeout(() => save(revision), 280); return; }
      label(forced ? '✓ Salvo agora' : '✓ Salvo');
    }

    function updateHint() {
      const hint = $('#hint');
      if (mode === 'type') { hint.textContent = 'Modo texto ativo. Suas anotações são salvas automaticamente.'; return; }
      if (tool === 'eraser') { hint.textContent = 'Borracha ativa. Toque em um traço para apagá-lo por inteiro.'; return; }
      if (tool === 'highlighter') { hint.textContent = 'Marca-texto ativo. Escolha uma cor e destaque sem pesar a página.'; return; }
      hint.textContent = penOnly ? 'Caneta ativa. Só o Apple Pencil escreve; a mão pode apoiar e rolar a página.' : 'Caneta ativa. Caneta, toque e mouse podem escrever.';
    }
    function setTool(nextTool) {
      tool = nextTool;
      [['penTool', 'pen'], ['highlighter', 'highlighter'], ['eraser', 'eraser']].forEach(([id, name]) => {
        const button = $(`#${id}`), active = tool === name;
        button.classList.toggle('active', active); button.setAttribute('aria-pressed', String(active));
      });
      $('#eraser').classList.toggle('eraser', tool === 'eraser');
      $('#penSizeControl').hidden = tool === 'eraser';
      $('#eraserSizeControl').hidden = tool !== 'eraser';
      updateHint();
    }
    function setMode(nextMode) {
      mode = nextMode;
      const paper = $('#paper');
      paper.dataset.mode = mode;
      paper.classList.toggle('pen-only', mode === 'draw' && penOnly);
      canvas.style.touchAction = mode === 'draw' ? (penOnly ? 'pan-y' : 'none') : 'auto';
      document.querySelectorAll('[data-mode]').forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
      $('#tools').hidden = mode !== 'draw';
      updateHint();
    }
    function render() {
      document.documentElement.classList.remove('access-checking'); $('#editor').hidden = false;
      $('#title').value = book.titulo || ''; $('#writing').value = sheet().texto || '';
      $('#bookMark').style.setProperty('--book-color', book.cor);
      document.querySelectorAll('[data-color]').forEach(button => button.classList.toggle('active', button.dataset.color === book.cor));
      paint(); setTool('pen'); setMode(mode);
    }

    const accepts = event => !penOnly || event.pointerType === 'pen';
    function eraseAt(currentPoint) {
      const current = sheet(), radius = eraserSize * 2.4;
      for (let index = current.tracos.length - 1; index >= 0; index -= 1) {
        const candidate = current.tracos[index], points = candidate.pontos || [];
        const hit = points.some((item, pointIndex) => pointIndex ? pointToSegment(currentPoint, points[pointIndex - 1], item) <= radius + Number(candidate.tamanho || 4) / 2 : distance(currentPoint, item) <= radius);
        if (!hit) continue;
        current.tracos.splice(index, 1); remember({ type: 'remove', stroke: candidate, index }); paint(); changed(); return;
      }
    }
    canvas.addEventListener('pointerdown', event => {
      if (mode !== 'draw' || !accepts(event)) return;
      event.preventDefault();
      const currentPoint = point(event); drawing = true; canvas.setPointerCapture?.(event.pointerId);
      if (tool === 'eraser') { lastErasePoint = currentPoint; eraseAt(currentPoint); return; }
      stroke = { id: uid(), ferramenta: tool === 'highlighter' ? 'highlight' : 'pen', cor: pen, tamanho: penSize, pontos: [currentPoint] };
      sheet().tracos.push(stroke); drawStroke(stroke);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drawing || mode !== 'draw' || !accepts(event)) return;
      event.preventDefault(); const currentPoint = point(event);
      if (tool === 'eraser') {
        if (!lastErasePoint || distance(lastErasePoint, currentPoint) >= Math.max(6, eraserSize / 2)) { lastErasePoint = currentPoint; eraseAt(currentPoint); }
        return;
      }
      if (!stroke) return;
      const previousPoint = stroke.pontos[stroke.pontos.length - 1];
      if (distance(previousPoint, currentPoint) < Math.max(2.5, Number(stroke.tamanho) * .45)) return;
      stroke.pontos.push(currentPoint); drawSegment(previousPoint, currentPoint, stroke);
    });
    function stopDrawing() {
      if (!drawing) return;
      drawing = false; lastErasePoint = null;
      if (stroke) { remember({ type: 'add', id: stroke.id }); stroke = null; changed(); }
    }
    function undo() {
      const action = history.pop(); if (!action) return;
      const current = sheet();
      if (action.type === 'add') current.tracos = current.tracos.filter(item => item.id !== action.id);
      if (action.type === 'remove') current.tracos.splice(action.index, 0, action.stroke);
      if (action.type === 'clear') { current.tracos = action.tracos; current.texto = action.texto; current.desenho = action.desenho; $('#writing').value = current.texto; }
      paint(); changed();
    }

    $('#writing').addEventListener('input', event => { sheet().texto = event.target.value; changed(); });
    $('#title').addEventListener('input', event => { book.titulo = event.target.value || 'Caderno sem título'; changed(); });
    $('#saveNow').addEventListener('click', () => save(revision, true));
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
    $('#penTool').addEventListener('click', () => setTool('pen'));
    $('#highlighter').addEventListener('click', () => setTool('highlighter'));
    $('#eraser').addEventListener('click', () => setTool('eraser'));
    document.querySelectorAll('[data-pen]').forEach(button => button.addEventListener('click', () => { pen = button.dataset.pen; document.querySelectorAll('[data-pen]').forEach(item => item.classList.toggle('active', item === button)); updateHint(); }));
    document.querySelectorAll('[data-color]').forEach(button => button.addEventListener('click', () => { book.cor = button.dataset.color; $('#bookMark').style.setProperty('--book-color', book.cor); document.querySelectorAll('[data-color]').forEach(item => item.classList.toggle('active', item === button)); changed(); }));
    $('#penSize').addEventListener('input', event => { penSize = Number(event.target.value); });
    $('#eraserSize').addEventListener('input', event => { eraserSize = Number(event.target.value); });
    $('#undo').addEventListener('click', undo);
    $('#clearInk').addEventListener('click', () => {
      const current = sheet();
      if (!current.texto && !current.tracos.length && !current.desenho) return;
      if (!confirm('Limpar toda a página? O texto e a escrita à mão serão apagados.')) return;
      remember({ type: 'clear', tracos: current.tracos, texto: current.texto, desenho: current.desenho });
      current.tracos = []; current.texto = ''; current.desenho = ''; $('#writing').value = ''; paint(); changed();
    });
    $('#penOnly').addEventListener('click', () => {
      penOnly = !penOnly;
      const button = $('#penOnly'); button.classList.toggle('active', penOnly); button.textContent = penOnly ? '✦ Só Apple Pencil' : '✦ Caneta, toque e mouse'; button.setAttribute('aria-pressed', String(penOnly));
      setMode(mode);
    });
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);
    canvas.addEventListener('pointerleave', event => { if (event.buttons === 0) stopDrawing(); });
    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); save(revision, true); }
      if (mode === 'draw' && (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); undo(); }
    });

    async function start() {
      if (!ready) { document.documentElement.classList.remove('access-checking'); message('A conexão não está disponível.', 'Volte à sua jornada e tente novamente.'); return; }
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { location.replace('cadernos.html'); return; }
      client = window.supabase.createClient(cfg.url, cfg.anonKey);
      const { data: { session }, error } = await client.auth.getSession();
      if (error || !session?.user) { location.replace('minha-jornada.html'); return; }
      user = session.user;
      const { data, error: loadError } = await client.from('cadernos_estudo').select('id,perfil_id,titulo,cor,paginas,updated_at').eq('id', id).eq('perfil_id', user.id).maybeSingle();
      if (loadError || !data) { document.documentElement.classList.remove('access-checking'); message('Não foi possível abrir este caderno.', loadError?.message || 'Volte à sua biblioteca e tente novamente.'); return; }
      book = normalize(data); render();
    }
    start().catch(error => { document.documentElement.classList.remove('access-checking'); message('Não foi possível abrir este caderno.', error.message || 'Tente novamente.'); });
  })();
  </script>
</body>
</html>
