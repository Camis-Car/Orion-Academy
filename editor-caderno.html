<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de caderno — Orion Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add('access-checking');</script>
  <style>
    :root{--navy:#0b1830;--blue:#183d64;--gold:#d8ad62;--ink:#152944;--muted:#6b7b90;--line:#dce4ec;--paper:#fffef9;--red:#a74c48}*{box-sizing:border-box}html.access-checking body{visibility:hidden}body{margin:0;background:#edf1f5;color:var(--ink);font-family:"DM Sans",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.appbar{position:sticky;z-index:8;top:0;display:flex;align-items:center;gap:16px;min-height:67px;padding:0 max(18px,calc((100vw - 1360px)/2));border-bottom:1px solid #27486a;background:var(--navy);color:#fff}.back{display:inline-flex;align-items:center;gap:7px;color:#ffffffd4;font-size:12px;font-weight:700}.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:"Playfair Display",Georgia,serif;font-size:18px}.brand i{display:grid;place-items:center;width:25px;height:30px;border:1px solid var(--gold);color:var(--gold);clip-path:polygon(50% 0,100% 18%,89% 100%,11% 100%,0 18%);font:700 17px Georgia;font-style:normal}.save{min-height:33px;padding:0 12px;border:1px solid var(--gold);border-radius:5px;color:#17243a;background:var(--gold);font-size:10px;font-weight:700}.save:disabled{opacity:.7}.shell{width:min(1360px,calc(100% - 34px));margin:20px auto 70px}.status{margin-bottom:13px;padding:14px 16px;border:1px solid #ebcdca;border-radius:7px;background:#fff5f4;color:#82463f;font-size:12px;line-height:1.55}.status[hidden]{display:none}.editor{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 12px 28px #0d1d3510}.titlebar{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line)}.book-mark{width:12px;height:36px;border-radius:99px;background:var(--book-color,#183d64)}.title{min-width:0;flex:1;padding:3px 0;border:0;border-bottom:1px solid transparent;outline:0;color:var(--navy);background:transparent;font-family:"Playfair Display",Georgia,serif;font-size:25px}.title:focus{border-bottom-color:var(--gold)}.colors{display:flex;gap:6px}.color{width:18px;height:18px;padding:0;border:2px solid #fff;border-radius:50%;outline:1px solid #bcc9d4;background:var(--book-color)}.color.active{outline:2px solid var(--gold);transform:scale(1.1)}.toolstrip{display:flex;align-items:center;gap:8px;min-height:57px;padding:10px 17px;border-bottom:1px solid var(--line);background:#f5f7fa}.modes,.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.mode,.tool{min-height:32px;padding:0 10px;border:1px solid #cad5df;border-radius:5px;color:#29435c;background:#fff;font-size:10px;font-weight:700}.mode.active{border-color:var(--blue);color:#fff;background:var(--blue)}.tool.active{border-color:#a77a34;color:#76551d;background:#fff8e9}.tool.eraser{border-color:#b6524a;color:#7f3732;background:#fff4f2}.tools[hidden]{display:none}.dot{width:25px;height:25px;padding:0;border:3px solid #fff;border-radius:50%;outline:1px solid #c7d2dc;background:var(--pen)}.dot.active{outline:2px solid var(--gold)}.size{display:inline-flex;align-items:center;gap:5px;color:#53677d;font-size:10px;font-weight:700}.size input{width:66px;accent-color:var(--blue)}.pen-only{margin-left:auto}.paper-wrap{padding:21px;background:#f1f4f7}.paper{position:relative;min-height:calc(100vh - 250px);overflow:hidden;border:1px solid #d5dde5;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--paper) 0,var(--paper) 31px,#d5e2ec 32px);box-shadow:0 9px 20px #0d1d3512}.writing{position:absolute;z-index:2;inset:0;resize:none;width:100%;height:100%;padding:25px 28px;border:0;outline:0;color:#18304a;background:transparent;font-size:15px;line-height:32px}.canvas{position:absolute;z-index:3;inset:0;width:100%;height:100%;touch-action:none}.paper[data-mode="type"] .canvas{pointer-events:none}.paper[data-mode="draw"] .writing{pointer-events:none;caret-color:transparent}.hint{margin:0;padding:11px 18px 13px;color:#6c7b8d;background:#f5f7fa;font-size:10px;line-height:1.5}.hint b{color:#235e49}@media(max-width:760px){.appbar{padding:0 14px;gap:10px}.brand{display:none}.shell{width:min(100% - 20px,680px);margin:10px auto 50px}.titlebar{padding:12px}.title{font-size:22px}.toolstrip{align-items:flex-start;flex-direction:column;padding:10px}.tools{width:100%}.size{width:calc(50% - 5px);justify-content:space-between}.size input{width:calc(100% - 71px)}.pen-only{margin-left:0;width:100%}.paper-wrap{padding:10px}.paper{min-height:calc(100vh - 310px)}.writing{padding:18px 16px;font-size:14px}.colors{margin-left:auto}}
  </style>
</head>
<body>
  <header class="appbar"><a class="back" href="cadernos.html">← Cadernos</a><span class="brand"><i>♗</i> Orion Academy</span><button class="save" id="saveNow" type="button">Salvo</button></header>
  <main class="shell"><section class="status" id="status" hidden aria-live="polite"></section><section class="editor" id="editor" hidden><div class="titlebar"><span class="book-mark" id="bookMark"></span><input class="title" id="title" maxlength="80" aria-label="Nome do caderno" /><div class="colors" aria-label="Cor do caderno"><button class="color" style="--book-color:#173a5e" data-color="#173a5e"></button><button class="color" style="--book-color:#29725a" data-color="#29725a"></button><button class="color" style="--book-color:#8a662b" data-color="#8a662b"></button><button class="color" style="--book-color:#a54b45" data-color="#a54b45"></button><button class="color" style="--book-color:#624b85" data-color="#624b85"></button></div></div><div class="toolstrip"><div class="modes"><button class="mode active" data-mode="type" type="button">⌨ Digitar</button><button class="mode" data-mode="draw" type="button">✎ Escrever</button></div><div class="tools" id="tools" hidden><button class="dot active" style="--pen:#173a5e" data-pen="#173a5e" type="button" aria-label="Azul"></button><button class="dot" style="--pen:#29725a" data-pen="#29725a" type="button" aria-label="Verde"></button><button class="dot" style="--pen:#a54b45" data-pen="#a54b45" type="button" aria-label="Vermelho"></button><button class="dot" style="--pen:#a77a34" data-pen="#a77a34" type="button" aria-label="Dourado"></button><label class="size">Caneta <input id="penSize" type="range" min="2" max="16" value="4" /></label><label class="size">Borracha <input id="eraserSize" type="range" min="6" max="44" value="20" /></label><button class="tool" id="highlighter" type="button">Marca-texto</button><button class="tool" id="eraser" type="button">Borracha por traço</button><button class="tool" id="undo" type="button">Desfazer</button><button class="tool" id="clearInk" type="button">Limpar escrita</button><button class="tool pen-only active" id="penOnly" type="button" aria-pressed="true">✦ Só caneta</button></div></div><div class="paper-wrap"><div class="paper" id="paper" data-mode="type"><textarea class="writing" id="writing" placeholder="Digite aqui as suas anotações..."></textarea><canvas class="canvas" id="canvas" width="1400" height="1900" aria-label="Área de escrita à mão"></canvas></div></div><p class="hint" id="hint">Modo digitação ativo. O texto é salvo automaticamente após uma breve pausa.</p></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cadastro-config.js"></script>
  <script>
  (()=>{const cfg=window.PROJETO_AQUILES_SUPABASE||{},ready=window.supabase&&/^https:\/\//.test(cfg.url||'')&&String(cfg.anonKey||'').length>20,$=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),status=$('#status');let client,user,book,mode='type',pen='#173a5e',penSize=4,eraserSize=20,tool='pen',penOnly=true,drawing=false,stroke=null,history=[],timer;
  const uid=()=>crypto.randomUUID?crypto.randomUUID():`stroke-${Date.now()}-${Math.random().toString(16).slice(2)}`,clone=v=>JSON.parse(JSON.stringify(v)),message=(a,b)=>{status.hidden=false;status.innerHTML=`<b>${a}</b><br>${b}`},sheet=()=>book?.paginas?.[0];const normalize=b=>{const p=Array.isArray(b.paginas)&&b.paginas.length?b.paginas:[{id:uid(),titulo:'Folha livre',texto:'',desenho:'',tracos:[]}];p[0].texto=typeof p[0].texto==='string'?p[0].texto:'';p[0].desenho=typeof p[0].desenho==='string'?p[0].desenho:'';p[0].tracos=Array.isArray(p[0].tracos)?p[0].tracos:[];return{...b,paginas:p}};
  function label(t,b=false){$('#saveNow').textContent=t;$('#saveNow').disabled=b}function snap(){history.push(clone(sheet().tracos));if(history.length>32)history.shift()}function renderStroke(c,s){const p=s?.pontos||[];if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.lineWidth=s.ferramenta==='highlight'?Number(s.tamanho)*4:Number(s.tamanho);c.globalAlpha=s.ferramenta==='highlight'?.25:1;c.strokeStyle=s.cor;c.beginPath();c.moveTo(p[0].x,p[0].y);if(p.length===1)c.lineTo(p[0].x+.1,p[0].y+.1);else p.slice(1).forEach(x=>c.lineTo(x.x,x.y));c.stroke();c.restore()}function paint(){const s=sheet();ctx.clearRect(0,0,canvas.width,canvas.height);const traces=()=>s.tracos.forEach(x=>renderStroke(ctx,x));if(!s.desenho){traces();return}const i=new Image();i.onload=()=>{ctx.drawImage(i,0,0,canvas.width,canvas.height);traces()};i.onerror=traces;i.src=s.desenho}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function distance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
  function changed(){clearTimeout(timer);label('Alterações pendentes');timer=setTimeout(()=>save(),1500)}async function save(force=false){if(!book)return;clearTimeout(timer);book.updated_at=new Date().toISOString();label('Salvando…',true);const{error}=await client.from('cadernos_estudo').upsert({id:book.id,perfil_id:user.id,titulo:book.titulo||'Caderno sem título',cor:book.cor,paginas:book.paginas,updated_at:book.updated_at},{onConflict:'id'});if(error){message('Não foi possível salvar.',error.message||'Tente novamente.');label('Salvar agora');return}label(force?'Salvo agora':'Salvo')}function erase(p){const s=sheet();for(let i=s.tracos.length-1;i>=0;i--){const t=s.tracos[i],pts=t.pontos||[],r=eraserSize*2.4+Number(t.tamanho||4)/2;if(pts.some((x,n)=>n?distance(p,pts[n-1],x)<=r:Math.hypot(p.x-x.x,p.y-x.y)<=r)){snap();s.tracos.splice(i,1);paint();changed();return}}}
  function setMode(n){mode=n;$('#paper').dataset.mode=n;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===n));$('#tools').hidden=n!=='draw';$('#hint').innerHTML=n==='draw'?`<b>${penOnly?'Só a ponta da caneta está ativa.':'Caneta, toque e mouse estão ativos.'}</b> A borracha remove o traço inteiro ao tocá-lo.`:'Modo digitação ativo. O texto é salvo automaticamente após uma breve pausa.'}function render(){document.documentElement.classList.remove('access-checking');$('#editor').hidden=false;$('#title').value=book.titulo||'';$('#writing').value=sheet().texto||'';$('#bookMark').style.setProperty('--book-color',book.cor);document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x.dataset.color===book.cor));paint();setMode(mode)}
  const accepts=e=>!penOnly||e.pointerType==='pen';canvas.addEventListener('pointerdown',e=>{if(mode!=='draw'||!accepts(e))return;e.preventDefault();const p=point(e);if(tool==='eraser'){erase(p);drawing=true;canvas.setPointerCapture?.(e.pointerId);return}snap();drawing=true;stroke={id:uid(),ferramenta:tool==='highlighter'?'highlight':'pen',cor:pen,tamanho:penSize,pontos:[p]};sheet().tracos.push(stroke);canvas.setPointerCapture?.(e.pointerId);renderStroke(ctx,stroke)});canvas.addEventListener('pointermove',e=>{if(!drawing||mode!=='draw'||!accepts(e))return;e.preventDefault();const p=point(e);if(tool==='eraser'){erase(p);return}const last=stroke.pontos.at(-1);stroke.pontos.push(p);renderStroke(ctx,{...stroke,pontos:[last,p]})});const stop=()=>{if(!drawing)return;drawing=false;stroke=null;if(tool!=='eraser')changed()};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('pointerleave',e=>{if(e.buttons===0)stop()});
  $('#writing').oninput=e=>{sheet().texto=e.target.value;changed()};$('#title').oninput=e=>{book.titulo=e.target.value||'Caderno sem título';changed()};$('#saveNow').onclick=()=>save(true);document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>setMode(x.dataset.mode));document.querySelectorAll('[data-pen]').forEach(x=>x.onclick=()=>{pen=x.dataset.pen;tool='pen';$('#eraser').classList.remove('active','eraser');$('#highlighter').classList.remove('active');document.querySelectorAll('[data-pen]').forEach(y=>y.classList.toggle('active',x===y))});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{book.cor=x.dataset.color;$('#bookMark').style.setProperty('--book-color',book.cor);document.querySelectorAll('[data-color]').forEach(y=>y.classList.toggle('active',x===y));changed()});$('#penSize').oninput=e=>penSize=Number(e.target.value);$('#eraserSize').oninput=e=>eraserSize=Number(e.target.value);$('#highlighter').onclick=()=>{tool=tool==='highlighter'?'pen':'highlighter';$('#highlighter').classList.toggle('active',tool==='highlighter');$('#eraser').classList.remove('active','eraser')};$('#eraser').onclick=()=>{tool=tool==='eraser'?'pen':'eraser';$('#eraser').classList.toggle('active',tool==='eraser');$('#eraser').classList.toggle('eraser',tool==='eraser');$('#highlighter').classList.remove('active')};$('#undo').onclick=()=>{const last=history.pop();if(!last)return;sheet().tracos=last;paint();changed()};$('#clearInk').onclick=()=>{if(!sheet().tracos.length||!confirm('Limpar toda a escrita à mão? O texto digitado será mantido.'))return;snap();sheet().tracos=[];sheet().desenho='';paint();changed()};$('#penOnly').onclick=()=>{penOnly=!penOnly;const b=$('#penOnly');b.classList.toggle('active',penOnly);b.textContent=penOnly?'✦ Só caneta':'⌘ Caneta, toque e mouse';b.setAttribute('aria-pressed',String(penOnly));setMode(mode)};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save(true)}if(mode==='draw'&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click()}});
  async function start(){if(!ready){document.documentElement.classList.remove('access-checking');message('A conexão não está disponível.','Volte à sua jornada e tente novamente.');return}const id=new URLSearchParams(location.search).get('id');if(!id){location.replace('cadernos.html');return}client=window.supabase.createClient(cfg.url,cfg.anonKey);const{data:{session},error}=await client.auth.getSession();if(error||!session?.user){location.replace('minha-jornada.html');return}user=session.user;const{data,error:loadError}=await client.from('cadernos_estudo').select('id,perfil_id,titulo,cor,paginas,updated_at').eq('id',id).eq('perfil_id',user.id).maybeSingle();if(loadError||!data){document.documentElement.classList.remove('access-checking');message('Não foi possível abrir este caderno.',loadError?.message||'Volte à sua biblioteca e tente novamente.');return}book=normalize(data);render()}start().catch(e=>{document.documentElement.classList.remove('access-checking');message('Não foi possível abrir este caderno.',e.message||'Tente novamente.')})})();
  </script>
</body>
</html>
