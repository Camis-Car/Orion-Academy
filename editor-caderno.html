    .editor{overflow:hidden;border:1px solid #d4dfe8;border-radius:18px;background:#fff;box-shadow:0 16px 42px #0d1d3515}.toolbar{display:flex;align-items:center;gap:10px;min-height:67px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}.tool-group{display:flex;align-items:center;gap:5px;padding-right:10px;border-right:1px solid #e1e8ef}.tool-group:last-child{margin-left:auto;padding-right:0;border-right:0}.tool,.mode,.color-dot,.size-dot,.paper-type,.eraser-type{display:inline-grid;place-items:center;flex:0 0 auto;width:38px;height:38px;padding:0;border:1px solid #dbe4ec;border-radius:12px;color:#405873;background:#fff;font-size:18px;line-height:1;transition:.16s}.tool:hover,.mode:hover,.paper-type:hover,.eraser-type:hover{border-color:#9ab7d3;background:#f6faff}.tool.active,.mode.active{border-color:#0a84ff;color:#0759aa;background:var(--blue-soft);box-shadow:0 2px 5px #0a84ff18}.tool.danger{color:var(--danger)}.tool.laser{color:#d72d35}.tool[data-label]{position:relative}.tool[data-label]:focus-visible:after,.tool[data-label]:hover:after{content:attr(data-label);position:absolute;z-index:22;top:calc(100% + 8px);left:50%;padding:5px 7px;border-radius:6px;color:#fff;background:#152b44;font:700 10px "DM Sans",Arial,sans-serif;white-space:nowrap;transform:translateX(-50%);pointer-events:none}.tool-legend{min-width:92px;color:#526a82;font-size:10px;font-weight:700;white-space:nowrap}.mode{width:auto;min-width:70px;padding:0 11px;gap:6px;font-size:11px;font-weight:700}.mode-strip{display:flex;gap:3px;padding:4px;border-radius:14px;background:#eef3f8}.palette{display:flex;align-items:center;gap:7px}.color-dot{width:25px;height:25px;border:3px solid #fff;border-radius:50%;outline:1px solid #c2cfda;background:var(--color)}.color-dot.active{outline:3px solid #0a84ff;transform:scale(1.08)}.sizes{display:flex;align-items:center;gap:5px}.size-dot{width:31px;height:31px;border-radius:50%;font-size:0}.size-dot:before{content:"";display:block;border-radius:50%;background:currentColor;width:var(--dot);height:var(--dot)}.size-dot.active{border-color:#0a84ff;color:#0a84ff;background:#eaf3ff}.eraser-options{display:none;align-items:center;gap:5px}.eraser-options.show{display:flex}.eraser-type{width:34px;height:34px;font-size:16px}.eraser-type.active{border-color:#ff9f0a;color:#a75d00;background:#fff5dc}.paper-options{display:flex;align-items:center;gap:4px}.paper-type{width:32px;height:32px;border-radius:9px;font-size:0}.paper-type:after{content:"";display:block;width:18px;height:18px;border:1px solid #65809b;border-radius:3px;background:#fff}.paper-type[data-paper="lined"]:after{background:repeating-linear-gradient(to bottom,#fff 0,#fff 4px,#6d90ae 5px)}.paper-type[data-paper="dotted"]:after{background-color:#fff;background-image:radial-gradient(#6d90ae 1px,transparent 1.4px);background-size:5px 5px}.paper-type[data-paper="grid"]:after{background-color:#fff;background-image:linear-gradient(#6d90ae 1px,transparent 1px),linear-gradient(90deg,#6d90ae 1px,transparent 1px);background-size:6px 6px}.paper-type[data-paper="blank"]:after{background:#fff}.paper-type.active{border-color:#0a84ff;background:#eaf3ff}.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
    .paper-wrap{padding:20px;background:#edf2f6}.paper{position:relative;min-height:calc(100vh - 226px);overflow:hidden;border:1px solid #d2dde7;border-radius:5px;background:var(--paper);box-shadow:0 13px 28px #0d1d351d;touch-action:pan-y}.paper[data-paper="lined"]{background:repeating-linear-gradient(to bottom,var(--paper) 0,var(--paper) 31px,#d7e3ed 32px)}.paper[data-paper="dotted"]{background-color:var(--paper);background-image:radial-gradient(#b8c7d5 1px,transparent 1.3px);background-size:18px 18px}.paper[data-paper="grid"]{background-color:var(--paper);background-image:linear-gradient(#d7e3ed 1px,transparent 1px),linear-gradient(90deg,#d7e3ed 1px,transparent 1px);background-size:28px 28px}.paper[data-paper="blank"]{background:var(--paper)}.writing{position:absolute;z-index:2;inset:0;resize:none;width:100%;height:100%;padding:26px 29px;border:0;outline:0;color:#152b44;background:transparent;font-size:16px;line-height:32px}.canvas{position:absolute;z-index:3;inset:0;width:100%;height:100%;touch-action:pan-y}.paper[data-mode="type"] .canvas{pointer-events:none}.paper[data-mode="draw"] .writing{pointer-events:none;caret-color:transparent}.textbox-layer{position:absolute;z-index:5;inset:0;pointer-events:none}.text-box{position:absolute;min-width:120px;max-width:min(560px,72%);padding:5px 25px 6px 8px;border:1px dashed transparent;border-radius:8px;color:#132a45;background:#ffffff08;pointer-events:auto}.text-box:focus-within,.text-box:hover{border-color:#0a84ff75;background:#ffffffc9}.text-box-content{min-width:90px;min-height:26px;outline:0;font-size:22px;font-weight:600;line-height:1.25;white-space:pre-wrap}.box-grip,.box-remove{position:absolute;display:none;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:6px;color:#fff;background:#0a84ff;font-size:12px}.box-grip{top:-10px;left:-10px;cursor:grab}.box-remove{top:-10px;right:-10px;background:#c44d48}.text-box:focus-within .box-grip,.text-box:focus-within .box-remove,.text-box:hover .box-grip,.text-box:hover .box-remove{display:grid}.laser-dot{position:absolute;z-index:8;display:none;width:25px;height:25px;border:3px solid #ff453a;border-radius:50%;box-shadow:0 0 0 4px #ff453a30,0 0 15px #ff453aaa;pointer-events:none;transform:translate(-50%,-50%)}.laser-dot.show{display:block}.guide{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 17px;color:#64778a;background:#f7fafc;font-size:11px;line-height:1.5}.guide b{color:#23604c}.import-progress{display:none;align-items:center;gap:8px;color:#23604c}.import-progress.show{display:flex}.page-shadow{position:absolute;z-index:0;right:-13px;bottom:-10px;left:13px;height:13px;border-radius:0 0 5px 5px;background:#d7e0e9;box-shadow:0 7px 0 #c8d4df}
    @media(max-width:1060px){.toolbar{align-items:flex-start;flex-wrap:wrap}.tool-group{padding-right:8px}.tool-group:last-child{margin-left:0}.paper-wrap{padding:12px}.paper{min-height:calc(100vh - 286px)}}@media(max-width:680px){.appbar{gap:8px;min-height:59px;padding:0 11px}.brand{font-size:16px}.back span{display:none}.book-name{max-width:90px}.page-state{display:none}.shell{width:min(100% - 12px,680px);margin:8px auto 40px}.editor{border-radius:12px}.toolbar{gap:7px;padding:8px;overflow-x:auto;flex-wrap:nowrap;align-items:center}.tool-group{flex:0 0 auto;padding-right:7px}.tool-group:last-child{margin-left:0}.mode{min-width:56px;padding:0 8px}.mode span{display:none}.paper-wrap{padding:7px}.paper{min-height:calc(100vh - 220px)}.writing{padding:19px 16px;font-size:15px}.guide{padding:10px 13px}.guide span:last-child{display:none}.paper-options{display:none}.color-dot{width:23px;height:23px}}

<body>
  <header class="appbar">
    <a class="back" href="cadernos.html" aria-label="Voltar aos cadernos">← <span>Cadernos</span></a>
    <span class="brand"><i aria-hidden="true"><svg viewBox="0 0 40 48" focusable="false"><path fill-rule="evenodd" d="M20 2L9 15c0 5.5 4.9 10.3 9 13.2L11 38h18l-7-9.8c4.1-2.9 7-9.7 7-13.2L20 2Zm3.9 5.4L14 16.2l4 3 9-10.1Z"/><path d="M8 40h24v3H8zM4 45h32v3H4z"/></svg></i><span class="book-name" id="bookName">Caderno</span></span>
    <span class="page-state" id="pageState" aria-live="polite">Folha 1</span>
    <button class="save-state" id="saveNow" type="button" aria-label="Salvar agora" title="Salvo automaticamente">✓</button>
  </header>
  <main class="shell">
    <section class="status" id="status" hidden aria-live="polite"></section>
    <section class="editor" id="editor" hidden>
      <div class="toolbar" aria-label="Ferramentas de anotação">
        <div class="tool-group"><div class="mode-strip" role="group" aria-label="Modo"><button class="mode active" data-mode="type" type="button" title="Digitar"><span>⌨</span> Texto</button><button class="mode" data-mode="draw" type="button" title="Escrever à mão"><span>✎</span> Escrever</button></div></div>
        <div class="tool-group" id="inkTools" hidden>
          <button class="tool active" data-label="Caneta" id="penTool" type="button" aria-label="Caneta" title="Caneta">✏</button>
          <button class="tool" data-label="Caneta tinteira" id="fountainTool" type="button" aria-label="Caneta tinteira" title="Caneta tinteira">🖋</button>
          <button class="tool" data-label="Iluminador" id="highlighter" type="button" aria-label="Iluminador" title="Iluminador">🖍</button>
          <button class="tool" data-label="Borracha" id="eraser" type="button" aria-label="Borracha" title="Borracha">⌫</button>
          <button class="tool laser" data-label="Laser" id="laserTool" type="button" aria-label="Laser para explicação" title="Laser para explicação">●</button>
          <button class="tool" data-label="Caixa de texto" id="textTool" type="button" aria-label="Adicionar caixa de texto" title="Adicionar caixa de texto">T</button>
        </div>
        <div class="tool-group palette" id="colorTools" hidden aria-label="Cores Apple">
          <button class="color-dot active" style="--color:#1c1c1e" data-pen="#1c1c1e" type="button" title="Preto" aria-label="Preto"></button><button class="color-dot" style="--color:#0a84ff" data-pen="#0a84ff" type="button" title="Azul" aria-label="Azul"></button><button class="color-dot" style="--color:#30d158" data-pen="#30d158" type="button" title="Verde" aria-label="Verde"></button><button class="color-dot" style="--color:#ff9f0a" data-pen="#ff9f0a" type="button" title="Laranja" aria-label="Laranja"></button><button class="color-dot" style="--color:#ff453a" data-pen="#ff453a" type="button" title="Vermelho" aria-label="Vermelho"></button><button class="color-dot" style="--color:#bf5af2" data-pen="#bf5af2" type="button" title="Roxo" aria-label="Roxo"></button>
        </div>
        <div class="tool-group sizes" id="sizeTools" hidden aria-label="Tamanho da ponta">
          <button class="size-dot active" style="--dot:4px" data-size="3" type="button" title="Ponta fina" aria-label="Ponta fina"></button><button class="size-dot" style="--dot:7px" data-size="5" type="button" title="Ponta média" aria-label="Ponta média"></button><button class="size-dot" style="--dot:11px" data-size="8" type="button" title="Ponta grossa" aria-label="Ponta grossa"></button><button class="size-dot" style="--dot:15px" data-size="12" type="button" title="Ponta extra grossa" aria-label="Ponta extra grossa"></button>
        </div>
        <div class="tool-group eraser-options" id="eraserOptions" aria-label="Modo da borracha">
          <button class="eraser-type active" data-eraser="normal" type="button" title="Borracha normal: apaga partes do traço" aria-label="Borracha normal">◌</button><button class="eraser-type" data-eraser="object" type="button" title="Borracha por objeto: apaga o traço inteiro" aria-label="Borracha por objeto">⌫</button>
        </div>
        <div class="tool-group paper-options" id="paperTools" aria-label="Tipo de folha">
          <button class="paper-type active" data-paper="lined" type="button" title="Folha pautada" aria-label="Folha pautada"></button><button class="paper-type" data-paper="dotted" type="button" title="Folha pontilhada" aria-label="Folha pontilhada"></button><button class="paper-type" data-paper="grid" type="button" title="Folha quadriculada" aria-label="Folha quadriculada"></button><button class="paper-type" data-paper="blank" type="button" title="Folha sem pauta" aria-label="Folha sem pauta"></button>
        </div>
        <div class="tool-group"><button class="tool" data-label="Importar PDF ou imagem" id="importFile" type="button" aria-label="Importar PDF ou imagem" title="Importar PDF ou imagem">＋</button><input class="file-input" id="filePicker" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" multiple /><button class="tool" data-label="Desfazer" id="undo" type="button" aria-label="Desfazer" title="Desfazer">↶</button><button class="tool danger" data-label="Apagar esta folha" id="clearPage" type="button" aria-label="Apagar tudo da folha" title="Apagar tudo da folha">🗑</button></div>
        <span class="tool-legend" id="toolLegend" aria-live="polite">✏ Caneta</span>
      </div>
      <div class="paper-wrap"><div class="paper" id="paper" data-mode="type" data-paper="lined"><div class="page-shadow" aria-hidden="true"></div><textarea class="writing" id="writing" placeholder="Digite suas anotações aqui..."></textarea><canvas class="canvas" id="canvas" width="1400" height="1900" aria-label="Área de escrita à mão"></canvas><div class="textbox-layer" id="textboxes" aria-label="Caixas de texto livres"></div><div class="laser-dot" id="laserDot" aria-hidden="true"></div></div></div>
      <div class="guide" id="guide"><span><b>Salvo automaticamente.</b> Deslize a folha para a esquerda para avançar ou criar outra.</span><span class="import-progress" id="importProgress">⌛ Importando...</span></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="cadastro-config.js"></script>
  <script>
  (() => {
    const cfg = window.PROJETO_AQUILES_SUPABASE || {};
    const ready = window.supabase && /^https:\/\//.test(cfg.url || '') && String(cfg.anonKey || '').length > 20;
    const $ = selector => document.querySelector(selector);
    const canvas = $('#canvas'), ctx = canvas.getContext('2d'), paper = $('#paper'), status = $('#status');
    const sheetTypes = ['lined', 'dotted', 'grid', 'blank'];
    const sizeChoices = [3, 5, 8, 12];
    let client, user, book, pageIndex = 0, mode = 'type', tool = 'pen', ink = '#1c1c1e', tipSize = 3, eraserMode = 'normal';
    let penOnly = true, drawing = false, stroke = null, history = [], saveTimer, revision = 0, saving = false, frame = 0, pendingPoint = null, lastPaintedPoint = null, laserPoint = null, swipeStart = null, dragBox = null;

    const uid = () => crypto.randomUUID ? crypto.randomUUID() : `item-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const current = () => book?.paginas?.[pageIndex];
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const makePage = (paperType = 'lined', image = '') => ({ id: uid(), titulo: 'Folha livre', texto: '', desenho: image, tracos: [], caixasTexto: [], tipoFolha: paperType });
    const label = (text, title = text) => { const button = $('#saveNow'); button.textContent = text; button.title = title; button.setAttribute('aria-label', title); };
    const message = (title, text) => { status.hidden = false; status.replaceChildren(); const strong = document.createElement('strong'); strong.textContent = title; status.append(strong, document.createElement('br'), document.createTextNode(text)); };
    const hideMessage = () => { status.hidden = true; status.textContent = ''; };

    function normalize(item) {
      const pages = Array.isArray(item.paginas) && item.paginas.length ? item.paginas : [makePage()];
      pages.forEach(page => {
        page.id = page.id || uid(); page.titulo = typeof page.titulo === 'string' ? page.titulo : 'Folha livre';
        page.texto = typeof page.texto === 'string' ? page.texto : ''; page.desenho = typeof page.desenho === 'string' ? page.desenho : '';
        page.tracos = Array.isArray(page.tracos) ? page.tracos : []; page.caixasTexto = Array.isArray(page.caixasTexto) ? page.caixasTexto : [];
        page.tipoFolha = sheetTypes.includes(page.tipoFolha) ? page.tipoFolha : 'lined';
      });
      return { ...item, paginas: pages };
    }
    function remember(action) { history.push(action); if (history.length > 50) history.shift(); }
    function scalePoint(event) { const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height }; }
    function styleFor(item) {
      if (item.ferramenta === 'highlight') return { width: Number(item.tamanho) * 3.6, alpha: .28 };
      if (item.ferramenta === 'fountain') return { width: Number(item.tamanho) * 1.15, alpha: .94 };
      return { width: Number(item.tamanho), alpha: 1 };
    }
    function drawSegment(first, second, item) {
      const style = styleFor(item); ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = style.width; ctx.globalAlpha = style.alpha; ctx.strokeStyle = item.cor;
      ctx.beginPath(); ctx.moveTo(first.x, first.y); ctx.lineTo(second.x, second.y); ctx.stroke(); ctx.restore();
    }
    function drawStroke(item) {
      const points = item?.pontos || []; if (!points.length) return;
      if (points.length === 1) { drawSegment(points[0], { x: points[0].x + .1, y: points[0].y + .1 }, item); return; }
      const style = styleFor(item); ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = style.width; ctx.globalAlpha = style.alpha; ctx.strokeStyle = item.cor;
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y); for (let index = 1; index < points.length; index += 1) ctx.lineTo(points[index].x, points[index].y); ctx.stroke(); ctx.restore();
    }
    function drawBackground(image) {
      const ratio = Math.min(canvas.width / image.width, canvas.height / image.height); const width = image.width * ratio, height = image.height * ratio;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(image, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
    }
    function paint() {
      const page = current(); if (!page) return; ctx.clearRect(0, 0, canvas.width, canvas.height);
      const traces = () => page.tracos.forEach(drawStroke);
      if (!page.desenho) { traces(); return; }
      const image = new Image(); image.onload = () => { drawBackground(image); traces(); }; image.onerror = traces; image.src = page.desenho;
    }
    function queueInk(point) {
      pendingPoint = point; if (frame) return;
      frame = requestAnimationFrame(() => { frame = 0; if (!stroke || !pendingPoint) return; const next = pendingPoint; pendingPoint = null; const previous = lastPaintedPoint || stroke.pontos[stroke.pontos.length - 1];
        if (distance(previous, next) < Math.max(4.5, Number(stroke.tamanho) * .8)) return;
        stroke.pontos.push(next); drawSegment(previous, next, stroke); lastPaintedPoint = next;
      });
    }
    function pointToSegment(test, first, second) { const dx = second.x - first.x, dy = second.y - first.y, length = dx * dx + dy * dy || 1; const ratio = clamp(((test.x - first.x) * dx + (test.y - first.y) * dy) / length, 0, 1); return Math.hypot(test.x - (first.x + ratio * dx), test.y - (first.y + ratio * dy)); }

    function changed(delay = 1300) { revision += 1; clearTimeout(saveTimer); label('•', 'Alterações pendentes — salvamento automático'); saveTimer = setTimeout(() => save(revision), delay); }
    async function save(targetRevision = revision, forced = false) {
      if (!book) return; clearTimeout(saveTimer);
      if (saving) { saveTimer = setTimeout(() => save(revision, forced), 350); return; }
      saving = true; label('…', 'Salvando alterações'); book.updated_at = new Date().toISOString();
      const { error } = await client.from('cadernos_estudo').upsert({ id: book.id, perfil_id: user.id, titulo: book.titulo || 'Caderno sem título', cor: book.cor || '#173a5e', paginas: book.paginas, updated_at: book.updated_at }, { onConflict: 'id' });
      saving = false;
      if (error) { message('Não foi possível salvar.', error.message || 'Tente novamente.'); label('!', 'Erro ao salvar — tente novamente'); return; }
      hideMessage(); if (revision > targetRevision) { label('•', 'Alterações pendentes — salvamento automático'); saveTimer = setTimeout(() => save(revision), 350); return; } label('✓', forced ? 'Salvo agora' : 'Salvo automaticamente');
    }
    function updateGuide() {
      const text = $('#guide').firstElementChild;
      if (mode === 'type') text.innerHTML = '<b>Modo texto.</b> Deslize a folha para a esquerda para avançar ou criar outra.';
      else if (tool === 'eraser') text.innerHTML = `<b>Borracha ${eraserMode === 'normal' ? 'normal' : 'por objeto'}.</b> Deslize para esquerda para mudar de folha.`;
      else if (tool === 'text') text.innerHTML = '<b>Caixa de texto.</b> Toque no T para criar outra e arraste o pequeno botão para movê-la.';
      else if (tool === 'laser') text.innerHTML = '<b>Laser.</b> Ele aponta durante a explicação e não fica salvo na folha.';
      else text.innerHTML = '<b>Escreva com o Apple Pencil.</b> A mão pode apoiar e rolar a página sem criar traços.';
    }
    function updateControls() {
      const inkOn = mode === 'draw'; $('#inkTools').hidden = !inkOn; $('#colorTools').hidden = !inkOn || ['eraser', 'text', 'laser'].includes(tool); $('#sizeTools').hidden = !inkOn || ['text', 'laser'].includes(tool); $('#eraserOptions').classList.toggle('show', inkOn && tool === 'eraser');
      [['penTool','pen'],['fountainTool','fountain'],['highlighter','highlight'],['eraser','eraser'],['laserTool','laser'],['textTool','text']].forEach(([id,name]) => $(`#${id}`).classList.toggle('active', tool === name));
      document.querySelectorAll('[data-eraser]').forEach(button => button.classList.toggle('active', button.dataset.eraser === eraserMode));
      document.querySelectorAll('[data-size]').forEach(button => button.classList.toggle('active', Number(button.dataset.size) === tipSize));
      const labels = { pen:'✏ Caneta', fountain:'🖋 Caneta tinteira', highlight:'🖍 Iluminador', eraser: eraserMode === 'normal' ? '⌫ Borracha normal' : '⌫ Borracha por objeto', laser:'● Laser', text:'T Caixa de texto' };
      $('#toolLegend').textContent = mode === 'type' ? '⌨ Texto' : labels[tool];
      updateGuide();
    }
    function applyPage() {
      const page = current(); if (!page) return; $('#writing').value = page.texto; paper.dataset.paper = page.tipoFolha; $('#pageState').textContent = `Folha ${pageIndex + 1}`; paper.dataset.mode = mode;
      document.querySelectorAll('[data-paper]').forEach(button => button.classList.toggle('active', button.dataset.paper === page.tipoFolha)); renderTextboxes(); paint(); updateControls();
    }
    function setMode(nextMode) { mode = nextMode; paper.dataset.mode = mode; document.querySelectorAll('[data-mode]').forEach(button => button.classList.toggle('active', button.dataset.mode === mode)); updateControls(); }
    function setTool(nextTool) { tool = nextTool; if (tool === 'text') createTextBox(); updateControls(); }
    function movePage(nextIndex, createWhenNeeded = false) {
      if (nextIndex < 0) return; if (nextIndex >= book.paginas.length) { if (!createWhenNeeded) return; book.paginas.push(makePage(current()?.tipoFolha || 'lined')); }
      pageIndex = clamp(nextIndex, 0, book.paginas.length - 1); applyPage(); changed(180);
    }

    function renderTextboxes() {
      const layer = $('#textboxes'); layer.replaceChildren(); const page = current();
      page.caixasTexto.forEach(box => {
        const shell = document.createElement('div'); shell.className = 'text-box'; shell.dataset.id = box.id; shell.style.left = `${(Number(box.x || 86) / canvas.width) * 100}%`; shell.style.top = `${(Number(box.y || 58) / canvas.height) * 100}%`; shell.style.color = box.cor || '#1c1c1e';
        const grip = document.createElement('button'); grip.type = 'button'; grip.className = 'box-grip'; grip.textContent = '⠿'; grip.title = 'Mover caixa de texto'; grip.setAttribute('aria-label','Mover caixa de texto');
        const content = document.createElement('div'); content.className = 'text-box-content'; content.contentEditable = 'true'; content.spellcheck = true; content.textContent = box.texto || ''; content.style.fontSize = `${Number(box.tamanho || 22)}px`;
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'box-remove'; remove.textContent = '×'; remove.title = 'Excluir caixa de texto'; remove.setAttribute('aria-label','Excluir caixa de texto');
        content.addEventListener('input', () => { box.texto = content.textContent; changed(); });
        grip.addEventListener('pointerdown', event => { event.preventDefault(); event.stopPropagation(); dragBox = { box, shell, pointerId: event.pointerId }; grip.setPointerCapture?.(event.pointerId); });
        grip.addEventListener('pointermove', event => { if (!dragBox || dragBox.pointerId !== event.pointerId) return; event.preventDefault(); const point = scalePoint(event); box.x = clamp(point.x, 8, canvas.width - 130); box.y = clamp(point.y, 8, canvas.height - 35); shell.style.left = `${box.x / canvas.width * 100}%`; shell.style.top = `${box.y / canvas.height * 100}%`; });
        const stopDrag = event => { if (dragBox?.pointerId !== event.pointerId) return; dragBox = null; changed(); }; grip.addEventListener('pointerup', stopDrag); grip.addEventListener('pointercancel', stopDrag);
        remove.addEventListener('click', () => { const index = page.caixasTexto.findIndex(item => item.id === box.id); if (index < 0) return; remember({ type: 'box-remove', box, index, pageId: page.id }); page.caixasTexto.splice(index, 1); renderTextboxes(); changed(); });
        shell.append(grip, content, remove); layer.append(shell);
      });
    }
    function createTextBox() {
      const page = current(); if (!page) return; const box = { id: uid(), x: 86, y: 58, texto: '', cor: ink, tamanho: 22 }; page.caixasTexto.push(box); remember({ type: 'box-add', id: box.id, pageId: page.id }); renderTextboxes(); changed();
      requestAnimationFrame(() => { const element = document.querySelector(`.text-box[data-id="${box.id}"] .text-box-content`); element?.focus(); });
    }
    function eraseObject(point) { const page = current(), radius = tipSize * 3.1; for (let index = page.tracos.length - 1; index >= 0; index -= 1) { const candidate = page.tracos[index], points = candidate.pontos || []; const hit = points.some((item, pointIndex) => pointIndex ? pointToSegment(point, points[pointIndex - 1], item) <= radius + Number(candidate.tamanho || 4) / 2 : distance(point, item) <= radius); if (!hit) continue; page.tracos.splice(index, 1); remember({ type:'replace-stroke', before:[candidate], after:[], index, pageId:page.id }); paint(); changed(); return; } }
    function erasePart(point) { const page = current(), radius = tipSize * 3.1; for (let index = page.tracos.length - 1; index >= 0; index -= 1) { const candidate = page.tracos[index], points = candidate.pontos || []; if (!points.length) continue; const pieces = [], fragment = []; let hit = false; points.forEach((item, pointIndex) => { const touches = pointIndex ? pointToSegment(point, points[pointIndex - 1], item) <= radius + Number(candidate.tamanho || 4) / 2 : distance(point, item) <= radius; if (touches) { hit = true; if (fragment.length > 1) pieces.push(fragment.splice(0)); else fragment.length = 0; } else fragment.push(item); }); if (fragment.length > 1) pieces.push(fragment); if (!hit) continue; const replacements = pieces.map(pointsPart => ({ ...candidate, id: uid(), pontos: pointsPart })); page.tracos.splice(index, 1, ...replacements); remember({ type:'replace-stroke', before:[candidate], after:replacements, index, pageId:page.id }); paint(); changed(); return; } }
    function eraseAt(point) { if (eraserMode === 'object') eraseObject(point); else erasePart(point); }
    function showLaser(point) { const rect = canvas.getBoundingClientRect(); const dot = $('#laserDot'); dot.style.left = `${point.x / canvas.width * rect.width}px`; dot.style.top = `${point.y / canvas.height * rect.height}px`; dot.classList.add('show'); }
    function stopLaser() { $('#laserDot').classList.remove('show'); laserPoint = null; }
    const acceptsInk = event => !penOnly || event.pointerType === 'pen';
    canvas.addEventListener('pointerdown', event => {
      if (mode !== 'draw') return; if (tool === 'text') return; if (!acceptsInk(event)) return;
      event.preventDefault(); const point = scalePoint(event); drawing = true; canvas.setPointerCapture?.(event.pointerId);
      if (tool === 'laser') { laserPoint = point; showLaser(point); return; }
      if (tool === 'eraser') { eraseAt(point); return; }
      stroke = { id:uid(), ferramenta: tool === 'highlight' ? 'highlight' : tool === 'fountain' ? 'fountain' : 'pen', cor:ink, tamanho:tipSize, pontos:[point] }; current().tracos.push(stroke); lastPaintedPoint = point; drawStroke(stroke);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drawing || mode !== 'draw' || !acceptsInk(event)) return; event.preventDefault(); const point = scalePoint(event);
      if (tool === 'laser') { laserPoint = point; showLaser(point); return; }
      if (tool === 'eraser') { if (!laserPoint || distance(laserPoint, point) >= Math.max(9, tipSize * 1.5)) { laserPoint = point; eraseAt(point); } return; }
      if (stroke) queueInk(point);
    });
    function stopDrawing() { if (!drawing) return; drawing = false; if (frame) { cancelAnimationFrame(frame); frame = 0; } if (stroke && pendingPoint && distance(stroke.pontos[stroke.pontos.length - 1], pendingPoint) >= 2) { stroke.pontos.push(pendingPoint); drawSegment(lastPaintedPoint || stroke.pontos[stroke.pontos.length - 2], pendingPoint, stroke); } if (stroke) { remember({ type:'add-stroke', id:stroke.id, pageId:current().id }); changed(); } stroke = null; pendingPoint = null; lastPaintedPoint = null; stopLaser(); }
    canvas.addEventListener('pointerup', stopDrawing); canvas.addEventListener('pointercancel', stopDrawing); canvas.addEventListener('pointerleave', event => { if (event.buttons === 0) stopDrawing(); });

    paper.addEventListener('pointerdown', event => { if (event.pointerType !== 'touch' || event.target.closest('.text-box')) return; swipeStart = { x:event.clientX, y:event.clientY, time:Date.now() }; });
    paper.addEventListener('pointerup', event => { if (!swipeStart || event.pointerType !== 'touch') return; const dx = event.clientX - swipeStart.x, dy = event.clientY - swipeStart.y; swipeStart = null; if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.35) return; if (dx < 0) movePage(pageIndex + 1, true); else if (pageIndex > 0) movePage(pageIndex - 1); });
    paper.addEventListener('pointercancel', () => { swipeStart = null; });

    async function fileToDataUrl(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Não foi possível ler o arquivo.')); reader.readAsDataURL(file); }); }
    async function pdfPages(file) {
      if (!window.pdfjsLib) throw new Error('O leitor de PDF ainda não carregou. Tente novamente em instantes.');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, pages = [];
      for (let number = 1; number <= pdf.numPages; number += 1) { const pdfPage = await pdf.getPage(number); const raw = pdfPage.getViewport({ scale: 1 }); const scale = Math.min(1.35, 1100 / raw.width); const viewport = pdfPage.getViewport({ scale }); const work = document.createElement('canvas'); work.width = Math.ceil(viewport.width); work.height = Math.ceil(viewport.height); await pdfPage.render({ canvasContext: work.getContext('2d'), viewport }).promise; pages.push(work.toDataURL('image/jpeg', .8)); }
      return pages;
    }
    async function importFiles(files) {
      if (!files.length) return; const progress = $('#importProgress'); progress.classList.add('show');
      try { const inserted = []; for (const file of files) { const images = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf') ? await pdfPages(file) : [await fileToDataUrl(file)]; images.forEach(image => inserted.push(makePage('blank', image))); }
        if (!inserted.length) return; book.paginas.splice(pageIndex + 1, 0, ...inserted); pageIndex += 1; applyPage(); changed(120); }
      catch (error) { message('Não foi possível importar este arquivo.', error.message || 'Escolha um PDF ou uma imagem e tente novamente.'); }
      finally { progress.classList.remove('show'); $('#filePicker').value = ''; }
    }
    function undo() {
      const action = history.pop(); if (!action) return; const page = book.paginas.find(item => item.id === action.pageId) || current(); if (!page) return;
      if (action.type === 'add-stroke') page.tracos = page.tracos.filter(item => item.id !== action.id);
      if (action.type === 'replace-stroke') page.tracos.splice(action.index, action.after.length, ...action.before);
      if (action.type === 'box-add') page.caixasTexto = page.caixasTexto.filter(item => item.id !== action.id);
      if (action.type === 'box-remove') page.caixasTexto.splice(action.index, 0, action.box);
      if (action.type === 'clear') { page.texto = action.texto; page.tracos = action.tracos; page.caixasTexto = action.caixasTexto; page.desenho = action.desenho; page.tipoFolha = action.tipoFolha; }
      applyPage(); changed();
    }
    function clearCurrent() { const page = current(); if (!page.texto && !page.tracos.length && !page.caixasTexto.length && !page.desenho) return; if (!confirm('Apagar tudo desta folha? A ação pode ser desfeita logo em seguida.')) return; remember({ type:'clear', texto:page.texto, tracos:page.tracos, caixasTexto:page.caixasTexto, desenho:page.desenho, tipoFolha:page.tipoFolha, pageId:page.id }); page.texto = ''; page.tracos = []; page.caixasTexto = []; page.desenho = ''; applyPage(); changed(); }

    $('#writing').addEventListener('input', event => { current().texto = event.target.value; changed(); });
    $('#saveNow').addEventListener('click', () => save(revision, true));
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
    $('#penTool').addEventListener('click', () => setTool('pen')); $('#fountainTool').addEventListener('click', () => setTool('fountain')); $('#highlighter').addEventListener('click', () => setTool('highlight')); $('#eraser').addEventListener('click', () => setTool('eraser')); $('#laserTool').addEventListener('click', () => setTool('laser')); $('#textTool').addEventListener('click', () => setTool('text'));
    document.querySelectorAll('[data-pen]').forEach(button => button.addEventListener('click', () => { ink = button.dataset.pen; document.querySelectorAll('[data-pen]').forEach(item => item.classList.toggle('active', item === button)); }));
    document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click', () => { tipSize = Number(button.dataset.size); updateControls(); }));
    document.querySelectorAll('[data-eraser]').forEach(button => button.addEventListener('click', () => { eraserMode = button.dataset.eraser; updateControls(); }));
    document.querySelectorAll('[data-paper]').forEach(button => button.addEventListener('click', () => { current().tipoFolha = button.dataset.paper; document.querySelectorAll('[data-paper]').forEach(item => item.classList.toggle('active', item === button)); applyPage(); changed(); }));
    $('#importFile').addEventListener('click', () => $('#filePicker').click()); $('#filePicker').addEventListener('change', event => importFiles([...event.target.files])); $('#undo').addEventListener('click', undo); $('#clearPage').addEventListener('click', clearCurrent);
    document.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); save(revision, true); } if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); undo(); } });

    async function start() {
      if (!ready) { document.documentElement.classList.remove('access-checking'); message('A conexão não está disponível.', 'Volte à sua jornada e tente novamente.'); return; }
      const id = new URLSearchParams(location.search).get('id'); if (!id) { location.replace('cadernos.html'); return; }
      client = window.supabase.createClient(cfg.url, cfg.anonKey); const { data:{ session }, error } = await client.auth.getSession(); if (error || !session?.user) { location.replace('minha-jornada.html'); return; }
      user = session.user; const { data, error:loadError } = await client.from('cadernos_estudo').select('id,perfil_id,titulo,cor,paginas,updated_at').eq('id', id).eq('perfil_id', user.id).maybeSingle();
      if (loadError || !data) { document.documentElement.classList.remove('access-checking'); message('Não foi possível abrir este caderno.', loadError?.message || 'Volte à sua biblioteca e tente novamente.'); return; }
      book = normalize(data); $('#bookName').textContent = book.titulo || 'Caderno'; document.documentElement.classList.remove('access-checking'); $('#editor').hidden = false; applyPage(); label('✓', 'Salvo automaticamente');
    }
    start().catch(error => { document.documentElement.classList.remove('access-checking'); message('Não foi possível abrir este caderno.', error.message || 'Tente novamente.'); });
  })();
  </script>
