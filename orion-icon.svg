<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Constelação de Órion — Orion Academy">
  <rect width="512" height="512" rx="116" fill="#0d1d35"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#d9ae63" stroke-width="3" opacity=".26"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#d9ae63" stroke-width="1.5" stroke-dasharray="3 12" opacity=".32"/>
  <!-- Órion: cabeça, ombros, as três estrelas do Cinturão, espada e pés. -->
  <g fill="none" stroke="#d9ae63" stroke-linecap="round" stroke-linejoin="round">
    <!-- Meissa, Betelgeuse e Bellatrix -->
    <path d="M256 100 142 178M256 100 369 174" stroke-width="2.5" opacity=".45"/>
    <!-- Ombros e Cinturão de Órion: Mintaka, Alnilam e Alnitak -->
    <path d="M142 178 196 255 256 270 316 285 369 174" stroke-width="3" opacity=".66"/>
    <path d="M196 255 256 270 316 285" stroke-width="6" opacity=".96"/>
    <!-- Quadril, Saiph e Rigel -->
    <path d="M142 178 166 386M369 174 360 390M196 255 166 386M316 285 360 390" stroke-width="3" opacity=".58"/>
    <!-- Espada abaixo do Cinturão -->
    <path d="m256 270-7 54 17 51" stroke-width="2.5" opacity=".7"/>
  </g>
  <g fill="#f4d594">
    <!-- Meissa (cabeça) -->
    <circle cx="256" cy="100" r="8"/>
    <!-- Betelgeuse e Bellatrix (ombros) -->
    <circle cx="142" cy="178" r="14"/>
    <circle cx="369" cy="174" r="11"/>
    <!-- Mintaka, Alnilam e Alnitak: o Cinturão -->
    <circle cx="196" cy="255" r="10"/>
    <circle cx="256" cy="270" r="12"/>
    <circle cx="316" cy="285" r="10"/>
    <!-- Saiph e Rigel (pés) -->
    <circle cx="166" cy="386" r="10"/>
    <circle cx="360" cy="390" r="14"/>
    <!-- estrelas da espada -->
    <circle cx="249" cy="324" r="6"/>
    <circle cx="266" cy="375" r="7"/>
  </g>
  <g fill="#fff5d8">
    <circle cx="256" cy="100" r="3"/>
    <circle cx="142" cy="178" r="5"/>
    <circle cx="369" cy="174" r="4"/>
    <circle cx="196" cy="255" r="4"/>
    <circle cx="256" cy="270" r="5"/>
    <circle cx="316" cy="285" r="4"/>
    <circle cx="166" cy="386" r="4"/>
    <circle cx="360" cy="390" r="5"/>
  </g>
</svg>
