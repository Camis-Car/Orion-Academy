<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crie ou redefina sua senha de acesso à Orion Academy." />
  <title>Criar ou redefinir senha — Orion Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#0d1d35;--blue:#173a5e;--gold:#d9ae63;--cream:#fbfaf7;--ink:#17243a;--muted:#667085;--line:#e1e6eb;--green:#29725a;--red:#a54b45;--pale:#f7eedb}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 83% 8%,rgba(100,138,177,.32),transparent 25%),linear-gradient(135deg,#0b192d,#173a5e);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}a{color:inherit}.wrap{width:min(520px,calc(100% - 42px));margin:0 auto}.top{padding:28px 0;color:#fff}.brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:"Playfair Display",Georgia,serif;font-size:21px;font-weight:600}.mark{width:34px;height:39px;display:grid;place-items:center;color:var(--gold);border:1px solid rgba(217,174,99,.75);clip-path:polygon(50% 0,100% 18%,89% 100%,11% 100%,0 18%)}main{padding:36px 0 74px}.card{padding:34px;background:#fff;border:1px solid rgba(217,174,99,.55);box-shadow:0 20px 50px rgba(5,15,29,.25)}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#a77a34;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.eyebrow:before{content:"";width:24px;height:1px;background:currentColor}h1{margin:12px 0;color:var(--navy);font:500 clamp(33px,7vw,44px)/1.1 "Playfair Display",Georgia,serif;letter-spacing:-.04em}.lead{margin:0 0 25px;color:var(--muted);font-size:13px;line-height:1.65}.field{margin-top:17px}.field label{display:block;margin-bottom:7px;color:#3b4a60;font-size:12px;font-weight:700}.field small{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.45}input{width:100%;min-height:46px;padding:0 12px;border:1px solid #d9e0e7;border-radius:4px;color:var(--ink);font:inherit;outline:0}input:focus{border-color:#bc9049;box-shadow:0 0 0 3px rgba(217,174,99,.13)}button{width:100%;min-height:47px;margin-top:22px;border:0;border-radius:4px;background:var(--gold);color:#1d2b3d;font:700 13px "DM Sans",Arial,sans-serif;cursor:pointer}button:disabled{opacity:.7;cursor:not-allowed}.message{min-height:20px;margin:13px 0 0;color:var(--red);font-size:12px;line-height:1.55}.message.success{color:var(--green)}.helper{margin:21px 0 0;padding-top:18px;border-top:1px solid var(--line);color:#667588;font-size:12px;line-height:1.6}.helper a{color:#76551d;font-weight:700;text-decoration:underline;text-underline-offset:3px}.hidden{display:none!important}@media(max-width:560px){.card{padding:25px}.top{padding-top:22px}main{padding-top:23px}}
  </style>
</head>
<body>
  <header class="wrap top"><a class="brand" href="index.html"><span class="mark" role="img" aria-label="Bispo de xadrez"><svg viewBox="0 0 40 48" aria-hidden="true" focusable="false" style="display:block;width:100%;height:100%" fill="currentColor"><path fill-rule="evenodd" d="M20 2L9 15c0 5.5 4.9 10.3 9 13.2L11 38h18l-7-9.8c4.1-2.9 9-7.7 9-13.2L20 2Zm3.9 5.4L14 16.2l4 3 9-10.1Z"/><path d="M8 40h24v3H8zM4 45h32v3H4z"/></svg></span>Orion Academy</a></header>
  <main class="wrap"><section class="card"><span class="eyebrow">Acesso à conta</span><h1 id="pageTitle">Criar ou recuperar senha</h1><p class="lead" id="pageText">Informe o e-mail do seu cadastro. Enviaremos um único link seguro para você criar uma senha ou trocá-la.</p>
    <form id="requestForm"><div class="field"><label for="email">E-mail do cadastro</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com" required /></div><button type="submit">Enviar link para criar senha</button></form>
    <form id="changeForm" class="hidden"><div class="field"><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Pelo menos 8 caracteres" required /><small>Escolha uma senha com pelo menos 8 caracteres.</small></div><div class="field"><label for="confirmation">Confirme a nova senha</label><input id="confirmation" type="password" autocomplete="new-password" placeholder="Repita a senha" required /></div><button type="submit">Salvar nova senha</button></form>
    <p class="message" id="message" aria-live="polite"></p><p class="helper">Depois disso, os próximos acessos serão feitos com e-mail e senha. <a href="minha-jornada.html">Voltar para entrar</a>.</p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cadastro-config.js"></script>
  <script>
    (() => {
      const config=window.PROJETO_AQUILES_SUPABASE||{};
      const ready=typeof window.supabase!=="undefined"&&/^https:\/\//.test(config.url||"")&&typeof config.anonKey==="string"&&config.anonKey.trim().length>20;
      const requestForm=document.getElementById("requestForm"),changeForm=document.getElementById("changeForm"),message=document.getElementById("message"),title=document.getElementById("pageTitle"),text=document.getElementById("pageText");
      const show=(content,good=false)=>{message.textContent=content;message.className=`message${good?" success":""}`};
      const changeMode=()=>{requestForm.classList.add("hidden");changeForm.classList.remove("hidden");title.textContent="Escolha sua nova senha";text.textContent="Crie uma senha forte para acessar sua jornada na Orion Academy.";show("",false)};
      if(!ready){show("A conexão com o acesso ainda não está disponível.");return}
      if(location.protocol!=="https:"&&location.protocol!=="http:"){show("Abra esta página pelo site publicado para receber links de recuperação.");return}
      const client=window.supabase.createClient(config.url,config.anonKey);
      client.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")changeMode()});
      if(/[?#].*type=recovery/.test(location.href))changeMode();
      requestForm.addEventListener("submit",async(event)=>{event.preventDefault();const button=requestForm.querySelector("button");button.disabled=true;button.textContent="Enviando…";show("");try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById("email").value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;show("Se existir uma conta para este e-mail, enviamos um link seguro para criar ou redefinir a senha.",true)}catch(error){show(error.message||"Não foi possível enviar o e-mail agora.")}finally{button.disabled=false;button.textContent="Enviar link para criar senha"}});
      changeForm.addEventListener("submit",async(event)=>{event.preventDefault();const password=document.getElementById("password").value,confirmation=document.getElementById("confirmation").value;if(password.length<8){show("Use uma senha com pelo menos 8 caracteres.");return}if(password!==confirmation){show("As duas senhas precisam ser iguais.");return}const button=changeForm.querySelector("button");button.disabled=true;button.textContent="Salvando…";show("");try{const {error}=await client.auth.updateUser({password});if(error)throw error;show("Senha atualizada. Agora você pode entrar normalmente.",true);window.setTimeout(()=>{location.href="minha-jornada.html"},900)}catch(error){show(error.message||"Não foi possível atualizar a senha. Solicite um novo link e tente novamente.")}finally{button.disabled=false;button.textContent="Salvar nova senha"}});
    })();
  </script>
</body>
</html>
